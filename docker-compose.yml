# Logging is capped on every service. The database volume and the container
# logs share one disk on the VM, and an unbounded json-file log fills it
# eventually — taking the database down with it.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:15-alpine
    container_name: tcf_db
    restart: always
    logging: *logging
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    # `restart: always` cannot tell a hung process from a healthy one without
    # something to ask. This is also what lets the backend wait for a database
    # that is actually accepting connections rather than merely started.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build: ./backend
    container_name: tcf_backend
    restart: always
    logging: *logging
    env_file:
      - .env
    environment:
      # A container IS the production deployment. Left to the code default of
      # "development" this served real traffic with Secure dropped from every
      # auth cookie, the weak-JWT-secret boot guard disabled, and uvicorn's
      # file-watching reloader running behind nginx. Override in .env only for
      # a local compose stack.
      ENV: ${ENV:-production}
      # The backend is published on 127.0.0.1 only (see `ports` below) and the
      # frontend nginx reaches it over the compose network, so every request
      # arrives through a proxy we run and X-Forwarded-For can be trusted.
      # Left unset, the API meters every anonymous caller under the proxy's own
      # address - one shared bucket for the whole internet, where ten failed
      # logins 429 everybody. Override in .env if you put something else in
      # front of it.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    # Published on loopback so a host nginx can reach it. The port is a
    # variable because the GCP VM already runs one on :80 that proxies to
    # 3000/5000 — hardcoding the ports here meant every deploy pulled a
    # docker-compose.yml that fought it, and the fix had to be re-applied by
    # hand and re-conflicted on the next pull. Set BACKEND_PORT in .env there.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 40s

  frontend:
    build: ./frontend
    container_name: tcf_frontend
    restart: always
    logging: *logging
    # nginx serves the static build and proxies /api to `backend` by service
    # name, so the browser only ever talks to one origin and no CORS applies.
    # FRONTEND_PORT lets a host that already owns :80 put this behind it.
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Nightly pg_dump, kept out of the application image so a backup never
  # depends on the backend being healthy. It writes to ./backups on the host;
  # copying those OFF this machine is a separate step and is not automated
  # here — a backup that lives on the disk it is protecting is not a backup.
  # See scripts/backup-db.sh and scripts/restore-db.sh.
  backup:
    image: postgres:15-alpine
    container_name: tcf_backup
    restart: always
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_NAME}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./scripts/backup-db.sh:/usr/local/bin/backup-db.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "backup: first run in 5 min, then every 24h, keeping $${BACKUP_KEEP_DAYS} days"
        sleep 300
        while true; do
          /bin/sh /usr/local/bin/backup-db.sh || echo "backup: FAILED at $$(date -Iseconds)"
          sleep 86400
        done

volumes:
  db_data:
