# Security headers, in an include rather than written once at server level.
#
# nginx `add_header` does not merge: a block that adds ANY header of its own
# discards every header inherited from its parent. Several locations here set
# their own Cache-Control, so writing these once at server level would have
# silently left index.html — the shell every visitor loads — with no CSP and
# no HSTS at all. Every location that calls add_header includes this file too.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Features this app has no use for, denied outright. The microphone is the
# exception and is allowed on this origin only — the speaking exercises need
# it, and nothing else here does.
#
# `payment` is allowed for Razorpay's origins and nowhere else. It was denied
# outright, which also denied it to the checkout iframe — that is the API
# behind Google Pay and the browser's own saved-card sheet, and losing it
# silently drops those payment methods with no error anywhere.
add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=(\"https://api.razorpay.com\" \"https://checkout.razorpay.com\"), usb=()" always;

# TLS terminates at the host proxy, so this header is what stops a browser
# trying plain HTTP again. `preload` is deliberately omitted: submitting to the
# preload list is close to irreversible and should be a decision of its own,
# not a side effect of a config edit.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Content-Security-Policy, enforcing. Every directive was derived from what the
# app actually loads:
#
#   script-src  'self' — the CRA build emits no inline executable script. The
#               one inline block is application/ld+json, which is data and is
#               not covered by script-src.
#   style-src   needs 'unsafe-inline' because React sets style="" attributes
#               (the scroll-reveal transitions), plus the Google Fonts
#               stylesheet host.
#   font-src    fonts.gstatic.com is where those faces actually come from.
#   img-src     data: for inlined icons, blob: for anything generated, and
#               media.prepfrancais.com for the listening question images.
#   media-src   blob: is the recorded answer, played back before upload;
#               media.prepfrancais.com is the listening audio.
#
#               THIS HOST MUST MATCH MEDIA_BASE_URL ON THE BACKEND. The API
#               hands the browser whatever that variable says, and anything not
#               named here is refused by the browser — the audio and the
#               question images both went dead the first time this was
#               switched to a bucket, and Chrome reported it as "Media load
#               rejected by URL safety check", which reads like a Safe
#               Browsing block and not like a policy of ours. Leaving
#               MEDIA_BASE_URL unset serves the media from this same origin,
#               which 'self' already covers.
#   script-src  also names static.cloudflareinsights.com, the analytics beacon.
#   connect-src 'self' plus cloudflareinsights.com, where that beacon reports.
#               The two are different hosts and both are required: the script
#               loads from static.cloudflareinsights.com and POSTs its
#               measurements to cloudflareinsights.com. Naming only the first
#               loads the script and blocks every report, which looks exactly
#               like having no analytics at all.
#               lib/api.js uses a relative "/api", so
#               the API is same-origin through this proxy. ADDING AN ANALYTICS
#               OR ERROR-REPORTING HOST MEANS ADDING IT HERE TOO — otherwise
#               its requests are blocked with no symptom but missing data.
#   Cashfree checkout needs four of these at once, and each fails
#   differently and silently: script-src for sdk.cashfree.com, the
#   checkout script; connect-src for api.cashfree.com, which it calls;
#   frame-src for payments.cashfree.com; and form-action for the same
#   host, because the SDK hands the browser over with a form POST and
#   form-action 'self' alone stops the purchase dead at the last step.
#
#   Razorpay needs the same four, on its own hosts, and both gateways are
#   listed because PAYMENT_PROVIDER selects between them at runtime — a
#   policy naming only the one currently configured would have to be
#   redeployed to switch, which defeats the point of the switch:
#     script-src   checkout.razorpay.com — the checkout script.
#     frame-src    api.razorpay.com and checkout.razorpay.com — the modal is
#                  an iframe on Razorpay's origin, and without this it opens
#                  blank, which reads to the customer as a broken site.
#     connect-src  api.razorpay.com, plus the lumberjack.* hosts its script
#                  reports to. Omitting those does not break a payment, but
#                  it fills the console with blocked requests during one.
#     form-action  api.razorpay.com, for the flows that leave the iframe and
#                  POST out to a bank or a UPI app.
#     img-src      cdn.razorpay.com, the method and bank logos.
#
#   frame-src   the landing hero embeds a YouTube video. Without this it
#               inherits default-src 'self' and is blocked outright - which is
#               exactly what happened when this policy first shipped, and the
#               hero sat empty until Lighthouse reported the violation.
#               frame-ancestors stays 'none': we frame YouTube, nobody frames us.
#   frame-ancestors / object-src / base-uri close off clickjacking, plugins
#               and base-tag injection.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com https://sdk.cashfree.com https://checkout.razorpay.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://i.ytimg.com https://cdn.razorpay.com https://media.prepfrancais.com https://www.google-analytics.com https://*.google-analytics.com; media-src 'self' blob: https://media.prepfrancais.com; connect-src 'self' https://cloudflareinsights.com https://api.cashfree.com https://sdk.cashfree.com https://api.razorpay.com https://checkout.razorpay.com https://lumberjack.razorpay.com https://lumberjack-cx.razorpay.com https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://payments.cashfree.com https://sdk.cashfree.com https://api.razorpay.com https://checkout.razorpay.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://payments.cashfree.com https://api.razorpay.com; object-src 'none'" always;
