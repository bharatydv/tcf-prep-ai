<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#7C3AED" />

    <!-- Google Analytics (gtag.js). The config block lives in /gtag-init.js
         rather than inline: script-src has no 'unsafe-inline', so an inline
         block is dropped and no data is ever collected. Both hosts are named
         in security-headers.conf. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-E829Q86M96"></script>
    <script defer src="/gtag-init.js"></script>

    <title>TEF &amp; TCF Canada practice with AI correction | prepfrancais</title>
    <meta name="description" content="AI preparation for the TEF and TCF Canada. Get your expression écrite and expression orale corrected, your CEFR level explained, mock exams, and review built from your own mistakes. 6 free corrections." />
    <link rel="canonical" href="https://prepfrancais.com/" />

    <!-- No hreflang, here or anywhere: the site is English-only and every page
         has exactly one address. The French interface that lived under /fr is
         gone and those URLs are 301'd — see src/lib/locale.js. The French that
         remains is the exam's own vocabulary, which is not a translation of
         anything. -->

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="prepfrancais" />
    <meta property="og:locale" content="en_CA" />
    <meta property="og:title" content="prepfrancais — Pass your TEF/TCF Canada" />
    <meta property="og:description" content="AI correction for your expression écrite and expression orale, your CEFR level explained, and review built from your own mistakes." />
    <meta property="og:url" content="https://prepfrancais.com/" />
    <meta property="og:image" content="https://prepfrancais.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="prepfrancais — TEF/TCF Canada preparation" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="prepfrancais — Pass your TEF/TCF Canada" />
    <meta name="twitter:description" content="AI correction for your expression écrite and expression orale, your CEFR level explained, and review built from your own mistakes." />
    <meta name="twitter:image" content="https://prepfrancais.com/og-image.png" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Fonts load without blocking the first paint: the stylesheet is fetched
         as print media, then promoted to all once it arrives. display=swap
         keeps text visible with the fallback stack in the meantime. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded plainly, not with the media="print" + onload="this.media='all'"
         trick. That trick needs an inline event handler, which the Content
         Security Policy blocks, so the stylesheet stayed print-only and the
         site rendered in fallback fonts for every visitor. display=swap in the
         URL already gives the behaviour the trick was reaching for: text
         paints immediately in the fallback face and swaps when the web font
         arrives. The preconnects above keep the request cheap. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap"
    />

    <!-- Identity and product facts, in the served HTML so crawlers that do not
         execute JavaScript can still read them. Per-page Article/FAQ markup is
         emitted by the Seo component on the routes that have it.

         sameAs is what ties this name to profiles that can corroborate it, and
         it is the main input to whether an answer engine treats "prepfrancais"
         as a real organisation worth citing. Both URLs are the CANONICAL
         profile addresses, not the share links they were copied from:
         instagram.com/prepfrancais?igsi=... carries a share-tracking parameter,
         and facebook.com/share/1DkFvdpju2/ is a redirect, not a page. A sameAs
         pointing at a redirect or a tracked URL is a weaker claim about
         identity than one pointing at the profile itself - so if either link
         is ever replaced, resolve it first and strip the query. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://prepfrancais.com/#organization",
            "name": "prepfrancais",
            "url": "https://prepfrancais.com/",
            "logo": "https://prepfrancais.com/icon-512.png",
            "description": "Online preparation for the TEF and TCF Canada, with AI correction of the expression écrite and expression orale.",
            "areaServed": "CA",
            "knowsLanguage": ["fr-CA", "en-CA"],
            "sameAs": [
              "https://www.instagram.com/prepfrancais",
              "https://www.facebook.com/people/Prep-Francais/61592984745939/"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://prepfrancais.com/#website",
            "url": "https://prepfrancais.com/",
            "name": "prepfrancais",
            "inLanguage": "en-CA",
            "publisher": { "@id": "https://prepfrancais.com/#organization" }
          },
          {
            "@type": "SoftwareApplication",
            "name": "prepfrancais",
            "applicationCategory": "EducationalApplication",
            "operatingSystem": "Web",
            "url": "https://prepfrancais.com/",
            "publisher": { "@id": "https://prepfrancais.com/#organization" },
            "inLanguage": "en-CA",
            "featureList": [
              "Expression écrite correction (TCF Canada tâches 1, 2 and 3)",
              "Expression orale correction with the official timers",
              "CEFR level from A1 to C2, with every score ceiling explained",
              "Personal error tracking and spaced review",
              "Compréhension écrite and compréhension orale mock exams"
            ],
            "offers": {
              "@type": "AggregateOffer",
              "priceCurrency": "USD",
              "lowPrice": "15",
              "highPrice": "220",
              "offerCount": "3",
              "description": "Free trial: 6 AI corrections to start, 3 written and 3 spoken. After that, weekly, monthly or quarterly plans."
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <!-- The <noscript> fallback that used to live here has been removed. It
         existed because every route served an empty React shell, so a crawler
         without JavaScript had nothing to read. The public routes are
         prerendered at build time now, so the real page IS the fallback - and
         keeping the block would have given every page a second, generic <h1>
         plus a paragraph identical to every other page's, competing with the
         page's own heading and content. -->
    <div id="root"></div>

    <!-- Cloudflare Web Analytics.
         Cookieless, so no consent banner is needed and EU visitors are counted
         like everyone else - which matters here, because a large share of TCF
         Canada candidates sit the exam from France, Belgium and North Africa.

         Installed by hand rather than injected. Automatic injection only
         reaches traffic passing through Cloudflare's proxy, and the DNS
         records for this domain are deliberately DNS-only: visitors go
         straight to the origin, so there is no proxy to inject anything.

         BOTH hosts are named in security-headers.conf - script-src for the
         beacon file, connect-src for where it reports to. Miss either and this
         fails silently: the page looks perfect and the dashboard stays at
         zero. -->
    <script type="module" defer
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "87c3671c3cf2498b91d1109e282e9b44"}'></script>
  </body>
</html>
