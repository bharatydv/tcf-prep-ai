    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Fonts load without blocking the first paint: the stylesheet is fetched
         as print media, then promoted to all once it arrives. display=swap
         keeps text visible with the fallback stack in the meantime. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded plainly, not with the media="print" + onload="this.media='all'"
         trick. That trick needs an inline event handler, which the Content
         Security Policy blocks, so the stylesheet stayed print-only and the
         site rendered in fallback fonts for every visitor. display=swap in the
         URL already gives the behaviour the trick was reaching for: text
         paints immediately in the fallback face and swaps when the web font
         arrives. The preconnects above keep the request cheap. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap"
    />

    <!-- Identity and product facts, in the served HTML so crawlers that do not
         execute JavaScript can still read them. Per-page Article/FAQ markup is
         emitted by the Seo component on the routes that have it. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://prepfrancais.com/#organization",
            "name": "prepfrancais",
            "url": "https://prepfrancais.com/",
            "logo": "https://prepfrancais.com/icon-512.png",
            "description": "Préparation en ligne au TEF et au TCF Canada, avec correction par IA de l'expression écrite et orale.",
            "areaServed": "CA",
            "knowsLanguage": ["fr-CA", "en-CA"]
          },
          {
            "@type": "WebSite",
            "@id": "https://prepfrancais.com/#website",
            "url": "https://prepfrancais.com/",
            "name": "prepfrancais",
            "inLanguage": "fr-CA",
            "publisher": { "@id": "https://prepfrancais.com/#organization" }
          },
          {
            "@type": "SoftwareApplication",
            "name": "prepfrancais",
            "applicationCategory": "EducationalApplication",
            "operatingSystem": "Web",
            "url": "https://prepfrancais.com/",
            "publisher": { "@id": "https://prepfrancais.com/#organization" },
            "inLanguage": "fr-CA",
            "featureList": [
              "Correction de l'expression écrite (tâches 1, 2 et 3 du TCF Canada)",
              "Correction de l'expression orale avec les minuteurs officiels",
              "Niveau CEFR de A1 à C2, avec chaque plafond de note expliqué",
              "Suivi personnalisé des erreurs et révision espacée",
              "Examens blancs de compréhension écrite et orale"
            ],
            "offers": {
              "@type": "AggregateOffer",
              "priceCurrency": "USD",
              "lowPrice": "15",
              "highPrice": "220",
              "offerCount": "3",
              "description": "Essai gratuit : 6 corrections IA pour commencer, 3 à l'écrit et 3 à l'oral. Ensuite, formules à la semaine, au mois ou au trimestre."
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <!-- The <noscript> fallback that used to live here has been removed. It
         existed because every route served an empty React shell, so a crawler
         without JavaScript had nothing to read. The public routes are
         prerendered at build time now, so the real page IS the fallback - and
         keeping the block would have given every page a second, generic <h1>
         plus a paragraph identical to every other page's, competing with the
         page's own heading and content. -->
    <div id="root"></div>

    <!-- Cloudflare Web Analytics.
         Cookieless, so no consent banner is needed and EU visitors are counted
         like everyone else - which matters here, because a large share of TCF
         Canada candidates sit the exam from France, Belgium and North Africa.

         Installed by hand rather than injected. Automatic injection only
         reaches traffic passing through Cloudflare's proxy, and the DNS
         records for this domain are deliberately DNS-only: visitors go
         straight to the origin, so there is no proxy to inject anything.

         BOTH hosts are named in security-headers.conf - script-src for the
         beacon file, connect-src for where it reports to. Miss either and this
         fails silently: the page looks perfect and the dashboard stays at
         zero. -->
    <script type="module" defer
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "87c3671c3cf2498b91d1109e282e9b44"}'></script>
  </body>
</html>
