server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 25 MB is the audio ceiling the API enforces; leave a little headroom for
    # the multipart envelope and reject anything larger before it is buffered.
    client_max_body_size 26m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/rss+xml image/svg+xml application/manifest+json;

    # See the file itself for why this is an include repeated in every block
    # rather than one set of directives here: nginx add_header does not merge.
    include /etc/nginx/security-headers.conf;

    # Hashed filenames, so they can never go stale.
    location /static/ {
        # One Cache-Control header, not two. `expires` emits its own, so pairing
        # it with add_header sent both "max-age=31536000" and "public, immutable"
        # as separate headers - ambiguous, and left to each cache to reconcile.
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # The shell must be revalidated or a deploy never reaches an open tab.
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/security-headers.conf;
    }
    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/security-headers.conf;
    }
    location = /llms.txt {
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/security-headers.conf;
    }

    # The SPA calls /api on its own origin; nothing else routes it there.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-sent events: no buffering, and a read timeout above the
        # backend's own 180s grading ceiling so nginx never drops a live grade.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # No add_header here, so the server-level include still applies. If one
        # is ever added, this block must include the headers file as well.
    }

    # Listening audio, when the API is serving it (MEDIA_BASE_URL unset).
    #
    # This block has to exist or the files are unreachable no matter where they
    # are on disk: without it /media/... falls through to `location /` below,
    # try_files hands back index.html, and nginx answers 200 with HTML. The
    # browser's <audio> element cannot decode that, so every clip failed with
    # "that recording could not be played" — a 200, so nothing looked wrong in
    # the access log either.
    #
    # Not needed at all when MEDIA_BASE_URL points at a bucket: the browser then
    # fetches the audio from that origin and never asks this server for it.
    location /media/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Seeking within a clip is a Range request; it must reach the backend
        # intact rather than being answered from a partial buffer.
        proxy_force_ranges on;

        # The audio never changes once imported — a re-import writes a new path
        # rather than a new body at the same one.
        add_header Cache-Control "public, max-age=31536000, immutable";
        # add_header above replaces the server-level set, so re-include them.
        include /etc/nginx/security-headers.conf;
    }

    # Prerendered routes are real files on disk (build:prerender). Anything
    # else — a signed-in page, a correction id, a blog post added since the
    # build — falls back to app-shell.html, the pristine empty shell, which is
    # preferred over index.html because a prerendered index.html carries the
    # *homepage* markup and would flash it before React took over.
    #
    # index.html is the last resort because the Docker image builds with plain
    # `npm run build`, which never emits app-shell.html. Without this final
    # fallback every deep link 404s in production, and there index.html is the
    # pristine shell anyway, so there is no homepage markup to flash.
    # Any redirect this server issues stays relative. Behind the host proxy
    # nginx only ever sees plain HTTP, so an absolute redirect would name
    # http:// and send an https visitor out to the insecure scheme and back.
    absolute_redirect off;

    # NOTE ON STATUS CODES: an unmatched URL falls through to a real file, so
    # nginx answers 200 — including for addresses the React router will render
    # as its 404 page. That is the normal limit of a client-routed SPA: the
    # server cannot know which paths the router recognises, so it cannot tell a
    # typo from /dashboard. The 404 page carries <meta name="robots" content=
    # "noindex">, and that tag — not the status line — is what keeps these out
    # of a search index. If a true 404 is ever needed, the prerender step
    # already enumerates the public routes and could emit an nginx map.
    location / {
        # $uri/index.html, not $uri/. Prerendering writes each route as a
        # directory containing index.html, and $uri/ makes nginx answer /pricing
        # with a 301 to /pricing/ - an extra hop, and a trailing slash that does
        # not match the canonical tag the page itself carries. Serving the file
        # directly means /pricing IS the page.
        try_files $uri $uri/index.html /app-shell.html /index.html;
    }

    location = /app-shell.html {
        internal;
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }
}
