server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 25 MB is the audio ceiling the API enforces; leave a little headroom for
    # the multipart envelope and reject anything larger before it is buffered.
    client_max_body_size 26m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/rss+xml image/svg+xml application/manifest+json;

    # Hashed filenames, so they can never go stale.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The shell must be revalidated or a deploy never reaches an open tab.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; }
    location = /robots.txt  { add_header Cache-Control "public, max-age=3600"; }
    location = /llms.txt    { add_header Cache-Control "public, max-age=3600"; }

    # The SPA calls /api on its own origin; nothing else routes it there.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-sent events: no buffering, and a read timeout above the
        # backend's own 180s grading ceiling so nginx never drops a live grade.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Prerendered routes are real files on disk (build:prerender). Anything
    # else — a signed-in page, a correction id, a blog post added since the
    # build — falls back to app-shell.html, the pristine empty shell. Falling
    # back to index.html would serve the prerendered *homepage* markup and
    # flash it before React took over.
    location / {
        try_files $uri $uri/ /app-shell.html;
    }

    location = /app-shell.html {
        internal;
        add_header Cache-Control "no-cache";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
